name: iosApp
options:
  bundleIdPrefix: com.fluffycat.sensorsmanager
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.fluffycat.sensorsmanager.ios
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    dependencies:
      # The static shared.framework is linked from FRAMEWORK_SEARCH_PATHS and made
      # available by the embedAndSignAppleFrameworkForXcode pre-build script; it is
      # linked into the binary, not embedded as a bundle.
      - framework: shared.framework
        link: true
        embed: false
        implicit: true
