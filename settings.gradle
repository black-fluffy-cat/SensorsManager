pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // PREFER_SETTINGS (instead of FAIL_ON_PROJECT_REPOS) so the Kotlin
    // Multiplatform plugin can register the ivy repository it needs to resolve
    // the Kotlin/Native dependencies for the iOS targets.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'SensorsManager'
include ':app'
include ':shared'
