name: CI Release artifact

on:
  push:
    tags:
      - '*'

jobs:
  Build_release_artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release apk
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Rename built artifact
        run: mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/SensorsManager_release_${{ github.ref_name }}.apk

      - name: Export release apk
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/SensorsManager_release_${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
